environment:
  name: "robosub_competition_pool"
  description: "RoboSub-inspired Autonomous Underwater Vehicle (AUV) competition pool"

pool:
  length: 20.0         # Course length along X axis (meters)
  width: 10.0          # Course width along Y axis (meters)
  depth: 4.0           # Nominal water depth (floor at z=0, waterline at z=4.0)
  wall_height: 4.5     # Total wall height (0.5m freeboard above waterline)
  wall_thickness: 0.3  # Structural wall collision thickness
  floor_thickness: 0.3 # Foundation slab thickness
  waterline_height: 4.0
  floor_material:
    color: [0.15, 0.38, 0.45, 1.0] # Deep aquatic pool floor tint
  wall_material:
    color: [0.18, 0.48, 0.55, 1.0] # Aquatic pool boundary wall tint

lighting:
  ambient: [0.35, 0.55, 0.65, 1.0]    # Blue-cyan underwater ambient light
  background: [0.05, 0.25, 0.35, 1.0] # Depth haze / back-scatter color
  sun:
    direction: [-0.3, 0.2, -0.9]
    diffuse: [0.75, 0.88, 0.95, 1.0]  # Surface sunlight penetrating water
    specular: [0.25, 0.25, 0.25, 1.0]

gate:
  position: [3.5, 0.0, 2.5]  # Gate frame center: X=3.5m, Y=0.0m, Z=2.5m
  rotation: [0.0, 0.0, 0.0]
  width: 3.05                # 120 in (3.05 m) width
  height: 1.52               # 60 in (1.52 m) height
  pipe_diameter: 0.06        # PVC frame diameter
  divider_width: 0.06        # Center partition separating mission corridors
  left_panel:
    top_color: [0.08, 0.08, 0.08, 1.0]   # Black upper
    bottom_color: [0.85, 0.05, 0.05, 1.0] # Red lower
  right_panel:
    top_color: [0.85, 0.05, 0.05, 1.0]   # Red upper ("Red, Right, Above")
    bottom_color: [0.08, 0.08, 0.08, 1.0] # Black lower

slalom:
  pole_count: 6
  pole_height: 2.2           # Vertical height of slalom poles (meters)
  pole_diameter: 0.06        # PVC pole outer diameter (meters)
  base_diameter: 0.40        # Weighted mooring base diameter
  poles:
    - id: "slalom_pole_1"
      position: [6.5, -1.0, 1.1]
      color: [0.95, 0.95, 0.95, 1.0] # White (port navigation boundary)
    - id: "slalom_pole_2"
      position: [7.5, 0.0, 1.1]
      color: [0.88, 0.08, 0.08, 1.0] # Red (center slalom marker)
    - id: "slalom_pole_3"
      position: [8.5, 1.0, 1.1]
      color: [0.95, 0.95, 0.95, 1.0] # White (starboard boundary)
    - id: "slalom_pole_4"
      position: [9.5, -1.0, 1.1]
      color: [0.95, 0.95, 0.95, 1.0] # White
    - id: "slalom_pole_5"
      position: [10.5, 0.0, 1.1]
      color: [0.88, 0.08, 0.08, 1.0] # Red
    - id: "slalom_pole_6"
      position: [11.5, 1.0, 1.1]
      color: [0.95, 0.95, 0.95, 1.0] # White

buoys:
  - id: "buoy_red"
    shape: "sphere"
    radius: 0.20
    position: [12.8, -1.8, 2.0]
    color: [0.90, 0.10, 0.10, 1.0]
  - id: "buoy_green"
    shape: "sphere"
    radius: 0.20
    position: [12.8, -0.9, 2.0]
    color: [0.10, 0.85, 0.20, 1.0]
  - id: "buoy_yellow"
    shape: "sphere"
    radius: 0.20
    position: [12.8, 0.0, 2.0]
    color: [0.95, 0.85, 0.05, 1.0]

bins:
  position: [14.0, -2.0, 0.15]
  length: 1.2
  width: 0.8
  height: 0.3
  compartments: 2
  frame_color: [0.15, 0.15, 0.15, 1.0]
  bin1_target_color: [0.85, 0.08, 0.08, 1.0] # Red Survey & Repair target
  bin2_target_color: [0.08, 0.35, 0.85, 1.0] # Blue Search & Rescue target

target_board:
  position: [14.2, 2.0, 1.5]
  rotation: [0.0, 0.0, 3.14159]
  width: 1.2
  height: 1.0
  thickness: 0.04
  board_color: [0.92, 0.92, 0.92, 1.0]
  large_target_radius: 0.15 # 30 cm aperture
  small_target_radius: 0.075 # 15 cm aperture

octagon_zone:
  position: [17.5, 0.0, 0.015]
  diameter: 2.74              # 9 ft (2.74 m) outer diameter
  border_thickness: 0.08      # Border strip width
  color: [1.0, 0.45, 0.0, 1.0]# Bright safety orange floor marking
  table_position: [17.5, 0.0, 0.30]
  table_size: [0.61, 0.61, 0.60] # 2 ft x 2 ft resupply table
  pinger_position: [17.5, 0.0, 0.05]

path_markers:
  dimensions: [1.22, 0.15, 0.01] # 4 ft x 6 in navigation strip
  color: [1.0, 0.45, 0.0, 1.0]   # High-visibility orange
  markers:
    - id: "path_marker_1"
      position: [4.8, 0.0, 0.01]
      yaw: 0.0
    - id: "path_marker_2"
      position: [12.2, -0.6, 0.01]
      yaw: -0.45
    - id: "path_marker_3"
      position: [15.8, 0.0, 0.01]
      yaw: 0.35

auv_placeholder:
  start_pose: [1.0, 0.0, 2.5, 0.0, 0.0, 0.0] # [x, y, z, roll, pitch, yaw]
  length: 0.80
  width: 0.40
  height: 0.30
  mass: 25.0
  hull_color: [0.95, 0.80, 0.05, 1.0] # High-vis submarine yellow
